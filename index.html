<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站搬迁通知 - TOTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
        }
        
        .container:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }
        
        .header {
            background: linear-gradient(120deg, #4b6cb7 0%, #182848 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
        }
        
        .logo-container {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            animation: float 4s ease-in-out infinite;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
        }
        
        .title {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.4rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .content {
            padding: 50px 40px;
            text-align: center;
        }
        
        .message {
            font-size: 1.25rem;
            margin-bottom: 30px;
            color: #444;
            line-height: 1.8;
        }
        
        .highlight {
            color: #2c5cc5;
            font-weight: 600;
            font-size: 1.3rem;
        }
        
        .new-url {
            display: inline-block;
            background: #f0f5ff;
            border: 2px dashed #4b6cb7;
            padding: 15px 25px;
            border-radius: 12px;
            margin: 25px 0;
            font-size: 1.4rem;
            color: #2c5cc5;
            font-weight: 600;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right, #4b6cb7, #2c5cc5);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 50px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(43, 92, 197, 0.25);
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(43, 92, 197, 0.4);
            background: linear-gradient(to right, #3a5ca5, #1d4ab5);
        }
        
        .btn i {
            margin-right: 10px;
            font-size: 1.3rem;
        }
        
        .info-box {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin: 40px 0 20px;
            text-align: left;
            border-left: 4px solid #4b6cb7;
        }
        
        .info-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2c5cc5;
            font-weight: 600;
        }
        
        .info-content {
            font-size: 1rem;
            color: #555;
        }
        
        .footer {
            padding: 25px;
            text-align: center;
            background: #f8f9ff;
            border-top: 1px solid #eaeef7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .signature {
            font-size: 1.1rem;
            color: #666;
            font-weight: 500;
        }
        
        .date {
            font-size: 1.1rem;
            color: #666;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .content {
                padding: 35px 25px;
            }
            
            .new-url {
                font-size: 1.1rem;
                padding: 12px 20px;
            }
            
            .footer {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .logo-container {
                width: 100px;
                height: 100px;
            }
            
            .logo {
                width: 65px;
                height: 65px;
            }
            
            .new-url {
                font-size: 1rem;
            }
            
            .btn {
                padding: 14px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <!-- 这里使用了Font Awesome图标作为占位，实际使用时替换为logocompressed.png -->
                <i class="fas fa-cloud-upload-alt logo" style="font-size: 60px; color: #4b6cb7;"></i>
                <!-- 实际使用时替换为：<img src="logocompressed.png" alt="TOTS Logo" class="logo"> -->
            </div>
            <h1 class="title">重要通知</h1>
            <p class="subtitle">我们的网站已搬迁至新地址</p>
        </div>
        
        <div class="content">
            <p class="message">
                亲爱的用户，感谢您一直以来的支持！为提供更优质的服务，<span class="highlight">TOTS</span> 网站已迁移至全新平台。
            </p>
            
            <div class="new-url">
                totscloud.top
            </div>
            
            <a href="http://totscloud.top" class="btn" id="redirectBtn">
                <i class="fas fa-external-link-alt"></i> 立即访问新网站
            </a>
            
            <div class="info-box">
                <h3 class="info-title">迁移说明</h3>
                <p class="info-content">
                    原网站已停止更新和维护，所有内容和服务已迁移至新域名 totscloud.top。
                    新网站提供更快的访问速度、增强的安全性和更丰富的功能。您的书签和收藏链接需要更新到新地址。
                    如有任何问题，请联系 tots666666@163.com。
                </p>
            </div>
        </div>
        
        <div class="footer">
            <div class="signature">TOTS的小站 - TOTS</div>
            <div class="date">2025年7月1日</div>
        </div>
    </div>

    <script>
        // 自动跳转功能（5秒后）
        setTimeout(function() {
            window.location.href = "http://totscloud.top";
        }, 5000);
        
        // 按钮点击事件
        document.getElementById('redirectBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = "http://totscloud.top";
        });
        
        // 添加悬浮动画效果
        const container = document.querySelector('.container');
        container.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-10px)';
        });
        
        container.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });
    </script>
</body>
</html>
